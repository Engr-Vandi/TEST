<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll 3D — Camera Journey</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #00f5d4;
    --accent2: #9b5de5;
    --bg: #020408;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    font-family: 'Courier New', monospace;
    color: #fff;
    /* The scroll height drives the animation */
    height: 600vh;
    overflow-x: hidden;
  }

  /* Canvas is fixed — stays in view while page scrolls */
  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
  }

  canvas { display: block; }

  /* All content sits above the 3D canvas */
  .content-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
  }

  /* ---- SECTION LABELS ---- */
  .scene-label {
    position: absolute;
    opacity: 0;
    transform: translateY(30px);
    transition: all 0.6s ease;
    pointer-events: none;
  }

  .scene-label.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .scene-label h2 {
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
    text-transform: uppercase;
  }

  .scene-label p {
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    opacity: 0.5;
    margin-top: 0.5rem;
    text-transform: uppercase;
  }

  #label-start  { top: 50%; left: 50%; transform: translate(-50%, -50%) translateY(30px); text-align: center; }
  #label-start.visible { transform: translate(-50%, -50%) translateY(0); }

  #label-mid    { top: 50%; left: 8%; transform: translateY(calc(-50% + 30px)); }
  #label-mid.visible { transform: translateY(-50%); }

  #label-end    { bottom: 10%; right: 8%; text-align: right; }

  /* ---- SCROLL INDICATOR ---- */
  .scroll-hint {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 1;
    transition: opacity 0.5s;
  }

  .scroll-hint span {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }

  .scroll-hint .arrow {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
    animation: scrollPulse 1.5s ease-in-out infinite;
  }

  @keyframes scrollPulse {
    0%, 100% { transform: scaleY(1); opacity: 1; }
    50% { transform: scaleY(0.6); opacity: 0.4; }
  }

  /* ---- PROGRESS BAR ---- */
  .progress-bar {
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .progress-track {
    width: 2px;
    height: 120px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    width: 100%;
    height: 0%;
    background: linear-gradient(to bottom, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: height 0.1s linear;
  }

  .progress-label {
    font-size: 0.55rem;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.3);
    writing-mode: vertical-rl;
    text-transform: uppercase;
  }

  /* ---- SCENE COUNTER ---- */
  .scene-counter {
    position: absolute;
    top: 32px;
    left: 32px;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }

  .scene-counter span {
    color: var(--accent);
    font-size: 1.2rem;
    font-weight: bold;
    display: block;
    line-height: 1;
  }

  /* ---- COORDINATES DISPLAY ---- */
  .coords {
    position: absolute;
    bottom: 32px;
    right: 80px;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.2);
    text-align: right;
    font-family: 'Courier New', monospace;
  }

  .coords div { margin-top: 2px; }
  .coords .val { color: rgba(0,245,212,0.6); }

  /* Gradient overlay at top and bottom for depth */
  .vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 40%, rgba(2,4,8,0.7) 100%);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="content-layer">
  <div class="vignette"></div>

  <!-- Scene counter -->
  <div class="scene-counter">
    Scene <span id="scene-num">01</span>
    <div style="margin-top:4px">/ 03</div>
  </div>

  <!-- Section labels that appear at different scroll points -->
  <div class="scene-label" id="label-start">
    <h2 style="color: var(--accent)">Enter<br>The Void</h2>
    <p>Scroll to begin</p>
  </div>

  <div class="scene-label" id="label-mid">
    <h2>Through<br><span style="color: var(--accent2)">The Field</span></h2>
    <p>01 — Deep space</p>
  </div>

  <div class="scene-label" id="label-end">
    <h2>Journey<br>Complete</h2>
    <p>02 — End point</p>
  </div>

  <!-- Scroll hint -->
  <div class="scroll-hint" id="scroll-hint">
    <span>Scroll</span>
    <div class="arrow"></div>
  </div>

  <!-- Progress bar -->
  <div class="progress-bar">
    <div class="progress-label">Progress</div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Live coordinates -->
  <div class="coords">
    <div>CAM_X <span class="val" id="cx">0.000</span></div>
    <div>CAM_Y <span class="val" id="cy">0.000</span></div>
    <div>CAM_Z <span class="val" id="cz">0.000</span></div>
  </div>
</div>

<script>
gsap.registerPlugin(ScrollTrigger);

// ─────────────────────────────────────────────
// 1. SCENE SETUP
// ─────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer  = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x020408, 1);
container.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

// Starting camera position — the JOURNEY begins here
camera.position.set(0, 0, 0);

// ─────────────────────────────────────────────
// 2. FOG — Creates depth illusion
// THREE.FogExp2(color, density)
// Higher density = thicker fog, shorter visible range
// ─────────────────────────────────────────────
scene.fog = new THREE.FogExp2(0x020408, 0.018);

// ─────────────────────────────────────────────
// 3. ENVIRONMENT: TUNNEL OF PARTICLES
// ─────────────────────────────────────────────
function createParticleField() {
  const count    = 3000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors    = new Float32Array(count * 3);

  const palette = [
    new THREE.Color(0x00f5d4), // cyan
    new THREE.Color(0x9b5de5), // purple
    new THREE.Color(0xffffff), // white
    new THREE.Color(0x00b4d8), // blue
  ];

  for (let i = 0; i < count; i++) {
    // Distribute particles in a long tunnel shape along Z axis
    const angle  = Math.random() * Math.PI * 2;
    const radius = 3 + Math.random() * 12;  // tunnel radius range
    const z      = (Math.random() - 0.5) * 200; // spread along Z (the path)

    positions[i * 3]     = Math.cos(angle) * radius;
    positions[i * 3 + 1] = Math.sin(angle) * radius;
    positions[i * 3 + 2] = z;

    // Random color from palette
    const c = palette[Math.floor(Math.random() * palette.length)];
    colors[i * 3]     = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 0.12,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    sizeAttenuation: true, // particles farther away appear smaller
  });

  return new THREE.Points(geometry, material);
}

const particles = createParticleField();
scene.add(particles);

// ─────────────────────────────────────────────
// 4. WAYPOINTS — floating geometric objects
// The camera passes NEAR these as it flies forward
// ─────────────────────────────────────────────
const waypoints = [
  // [x, y, z, geometry, color]
  { x: -4,  y: 1,   z: -20,  geo: new THREE.OctahedronGeometry(0.8),   color: 0x00f5d4 },
  { x: 3,   y: -2,  z: -40,  geo: new THREE.IcosahedronGeometry(0.6),  color: 0x9b5de5 },
  { x: -2,  y: 3,   z: -60,  geo: new THREE.TetrahedronGeometry(1.0),  color: 0x00b4d8 },
  { x: 5,   y: 0,   z: -80,  geo: new THREE.OctahedronGeometry(0.5),   color: 0xff6b6b },
  { x: -5,  y: -2,  z: -100, geo: new THREE.IcosahedronGeometry(0.9),  color: 0x00f5d4 },
  { x: 2,   y: 4,   z: -120, geo: new THREE.TorusGeometry(0.8, 0.2, 8, 20), color: 0x9b5de5 },
  { x: -3,  y: -1,  z: -140, geo: new THREE.OctahedronGeometry(1.2),   color: 0xffd166 },
];

const meshes = [];
waypoints.forEach(wp => {
  const mat  = new THREE.MeshStandardMaterial({
    color: wp.color,
    metalness: 0.8,
    roughness: 0.2,
    wireframe: Math.random() > 0.5, // some wireframe, some solid
  });
  const mesh = new THREE.Mesh(wp.geo, mat);
  mesh.position.set(wp.x, wp.y, wp.z);
  scene.add(mesh);
  meshes.push(mesh);
});

// ─────────────────────────────────────────────
// 5. LIGHTING
// ─────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0x00f5d4, 2, 50);
pointLight1.position.set(0, 5, -20);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x9b5de5, 2, 50);
pointLight2.position.set(0, -5, -80);
scene.add(pointLight2);

// ─────────────────────────────────────────────
// 6. THE CAMERA PATH — This is the core concept
//
// We define KEYFRAME positions the camera will visit.
// GSAP ScrollTrigger maps scroll % → camera position.
//
// Think of it like a train on a track:
// Scroll 0%   = start of track
// Scroll 50%  = middle of track
// Scroll 100% = end of track
// ─────────────────────────────────────────────
const cameraPath = [
  // { z, y, x, rotX, rotY } — keyframes along the journey
  { z: 0,    y: 0,    x: 0,   rotX: 0,    rotY: 0    }, // start
  { z: -30,  y: 1,    x: -1,  rotX: 0.05, rotY: 0.1  }, // curve left
  { z: -60,  y: -1,   x: 2,   rotX: -0.03, rotY: -0.1 }, // curve right
  { z: -100, y: 2,    x: 0,   rotX: 0.08, rotY: 0    }, // rise
  { z: -150, y: 0,    x: 0,   rotX: 0,    rotY: 0    }, // end
];

// The animated camera state object
// GSAP will tween these values
const camState = {
  z: 0, y: 0, x: 0,
  rotX: 0, rotY: 0,
  fogDensity: 0.018,
};

// ─────────────────────────────────────────────
// 7. GSAP SCROLLTRIGGER — The magic link
//    between scroll position and camera
// ─────────────────────────────────────────────
const tl = gsap.timeline({
  scrollTrigger: {
    trigger: 'body',
    start: 'top top',       // When top of body hits top of viewport
    end: 'bottom bottom',   // When bottom of body hits bottom of viewport
    scrub: 1.5,             // Smooth lag (seconds) between scroll and animation
                            // 0 = instant snap, higher = more lag/smoothness
    onUpdate: (self) => {
      const p = self.progress; // 0 to 1

      // Update progress bar UI
      document.getElementById('progress-fill').style.height = (p * 100) + '%';

      // Update scene counter
      const sceneNum = p < 0.4 ? '01' : p < 0.75 ? '02' : '03';
      document.getElementById('scene-num').textContent = sceneNum;

      // Toggle content labels based on scroll progress
      const labelStart = document.getElementById('label-start');
      const labelMid   = document.getElementById('label-mid');
      const labelEnd   = document.getElementById('label-end');
      const scrollHint = document.getElementById('scroll-hint');

      labelStart.classList.toggle('visible', p < 0.05);
      scrollHint.style.opacity = p < 0.05 ? '1' : '0';
      labelMid.classList.toggle('visible', p > 0.35 && p < 0.65);
      labelEnd.classList.toggle('visible', p > 0.85);
    }
  }
});

// Add keyframes to the timeline
// Each keyframe is a .to() that moves camState to the next position
cameraPath.forEach((kf, i) => {
  if (i === 0) return; // skip first, it's the starting state
  tl.to(camState, {
    z: kf.z,
    y: kf.y,
    x: kf.x,
    rotX: kf.rotX,
    rotY: kf.rotY,
    // Each segment is equal duration (1 unit each)
    duration: 1,
    ease: 'none', // Linear is crucial for scroll-sync
                  // Non-linear easing would feel weird with scroll
  });
});

// Fog density animation — gets thicker mid-journey
tl.to(camState, { fogDensity: 0.035, duration: 0.5, ease: 'none' }, 0.3);
tl.to(camState, { fogDensity: 0.015, duration: 0.5, ease: 'none' }, 0.7);

// ─────────────────────────────────────────────
// 8. RENDER LOOP — Apply camState to actual camera
// ─────────────────────────────────────────────
let time = 0;

function animate() {
  requestAnimationFrame(animate);
  time += 0.005;

  // Apply scroll-driven position to camera
  camera.position.z = camState.z;
  camera.position.y = camState.y;
  camera.position.x = camState.x;
  camera.rotation.x = camState.rotX;
  camera.rotation.y = camState.rotY;

  // Apply dynamic fog density
  scene.fog.density = camState.fogDensity;

  // Idle rotation on all waypoint objects
  meshes.forEach((mesh, i) => {
    mesh.rotation.x += 0.005 + i * 0.001;
    mesh.rotation.y += 0.008 + i * 0.001;
  });

  // Subtle particle drift
  particles.rotation.z = Math.sin(time * 0.3) * 0.01;

  // Move lights slightly for living feel
  pointLight1.position.x = Math.sin(time) * 3;
  pointLight2.position.x = Math.cos(time * 0.7) * 3;

  // Update coordinate display
  document.getElementById('cx').textContent = camera.position.x.toFixed(3);
  document.getElementById('cy').textContent = camera.position.y.toFixed(3);
  document.getElementById('cz').textContent = camera.position.z.toFixed(3);

  renderer.render(scene, camera);
}

animate();

// ─────────────────────────────────────────────
// 9. RESIZE HANDLER
// ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Show start label
setTimeout(() => {
  document.getElementById('label-start').classList.add('visible');
}, 300);
</script>
</body>
</html>
